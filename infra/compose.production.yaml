name: climbing-crm-poc-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      API_PORT: 3101
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WEB_ORIGIN: https://${APP_DOMAIN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      HOLD_MODEL_PROCESSING_ENABLED: ${HOLD_MODEL_PROCESSING_ENABLED:-true}
      CAMERA_LIVE_ENABLED: ${CAMERA_LIVE_ENABLED:-true}
      CAMERA_LIVE_NAME: ${CAMERA_LIVE_NAME:-攀岩墙主摄像头}
      CAMERA_PLAYER_URL: ${CAMERA_PLAYER_URL}
      CAMERA_RESOURCE_URL: ${CAMERA_RESOURCE_URL}
      CAMERA_PROBE_URL: ${CAMERA_PROBE_URL}
      CAMERA_PROBE_TIMEOUT_MS: ${CAMERA_PROBE_TIMEOUT_MS:-4000}
      CAMERA_PROBE_CACHE_MS: ${CAMERA_PROBE_CACHE_MS:-10000}
      CAMERA_SNAPSHOT_TIMEOUT_MS: ${CAMERA_SNAPSHOT_TIMEOUT_MS:-20000}
      CAMERA_SNAPSHOT_CACHE_MS: ${CAMERA_SNAPSHOT_CACHE_MS:-5000}
      CAMERA_SNAPSHOT_STALE_MS: ${CAMERA_SNAPSHOT_STALE_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3101/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:3101/api
      NEXT_PUBLIC_API_BASE_URL: http://api:3101/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3100/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
